name: News Archiver

on:
  schedule:
    - cron: "0 */4 * * *"   # 每4小时
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    name: Fetch all sites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Fetch all sites sequentially
        run: |
          # 获取网站总数
          TOTAL=$(python -c "from scripts.config import SITES; print(len(SITES))")
          for i in $(seq 0 $((TOTAL-1))); do
            echo "Fetching site index $i"
            SITE_INDEX=$i python scripts/fetch_site.py
          done

      - name: Generate navigation page
        run: python scripts/generate_nav.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www/   # 包含 index.html, sites/, archives/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
